<!DOCTYPE html>
<html lang="es" data-theme="dark" data-base="../">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Detalle de proyecto del portafolio de Andrey Mantilla: características, galería y stack tecnológico.">
    <meta name="theme-color" content="#2b45d8">
    <title data-title-key="meta.detailTitle">Detalle del proyecto | Andrey Mantilla</title>

    <link rel="apple-touch-icon" sizes="180x180" href="../img/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../img/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../img/favicon/favicon-16x16.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/main.css">
</head>
<body class="project-page">

    <!-- NAVBAR -->
    <nav class="navbar is-stuck" data-navbar>
        <div class="container navbar__inner">
            <a href="../index.html#proyectos" class="btn btn--ghost btn--sm">
                <i class="fas fa-arrow-left" aria-hidden="true"></i>
                <span data-i18n="detail.back">Volver al portafolio</span>
            </a>

            <div class="nav-actions">
                <div class="lang-switch" role="group" aria-label="Idioma">
                    <button class="lang-switch__btn" type="button" data-lang="es">ES</button>
                    <button class="lang-switch__btn" type="button" data-lang="en">EN</button>
                </div>

                <button class="icon-btn theme-toggle" type="button" data-theme-toggle data-i18n="nav.theme" data-i18n-attr="aria-label" aria-label="Cambiar tema">
                    <i class="icon-sun fas fa-sun" aria-hidden="true"></i>
                    <i class="icon-moon fas fa-moon" aria-hidden="true"></i>
                </button>
            </div>
        </div>
    </nav>

    <!-- HERO PROYECTO -->
    <section class="project-hero">
        <div class="grid-backdrop"></div>
        <div class="container">
            <div class="project-hero__inner">
                <nav class="breadcrumb" aria-label="breadcrumb">
                    <a href="../index.html" data-i18n="detail.home">Inicio</a>
                    <i class="fas fa-chevron-right" aria-hidden="true"></i>
                    <a href="../index.html#proyectos" data-i18n="detail.projects">Proyectos</a>
                    <i class="fas fa-chevron-right" aria-hidden="true"></i>
                    <span data-crumb-title></span>
                </nav>

                <span class="chip chip--brand" data-project-type></span>
                <h1 class="project-hero__title" data-project-title></h1>
                <p class="project-hero__desc" data-project-desc></p>

                <div class="project-hero__meta chip-group" data-project-meta></div>
                <div class="project-actions" data-project-actions></div>
            </div>
        </div>
    </section>

    <!-- GALERIA -->
    <section class="section" style="padding-block: var(--space-7);">
        <div class="container">
            <div class="section__head" data-reveal>
                <span class="section__eyebrow" data-i18n="detail.galleryTitle">Galería del proyecto</span>
                <p class="section__subtitle" data-i18n="detail.galleryHint"></p>
            </div>

            <div class="gallery" data-reveal>
                <div class="gallery__stage">
                    <!-- IMG -->
                    <img class="gallery__image" data-gallery-image src="" alt="">
                    <button class="gallery__nav gallery__nav--prev" type="button" data-gallery-prev aria-label="Anterior">
                        <i class="fas fa-chevron-left" aria-hidden="true"></i>
                    </button>
                    <button class="gallery__nav gallery__nav--next" type="button" data-gallery-next aria-label="Siguiente">
                        <i class="fas fa-chevron-right" aria-hidden="true"></i>
                    </button>
                    <span class="gallery__counter" data-gallery-counter></span>
                </div>

                <div class="gallery__thumbs" data-gallery-thumbs></div>
            </div>

            <!-- DETALLE -->
            <div class="project-body">
                <div>
                    <article class="detail-card" data-reveal>
                        <header class="detail-card__head">
                            <i class="fas fa-circle-check" aria-hidden="true"></i>
                            <h2 data-i18n="detail.featuresTitle">Características principales</h2>
                        </header>
                        <ul class="check-list" data-features></ul>
                    </article>

                    <article class="detail-card" data-reveal>
                        <header class="detail-card__head">
                            <i class="fas fa-layer-group" aria-hidden="true"></i>
                            <h2 data-i18n="detail.stackTitle">Stack tecnológico</h2>
                        </header>
                        <p class="tech-copy" data-tech-copy></p>
                        <div class="tech-grid" data-tech-grid></div>
                    </article>
                </div>

                <aside class="project-aside">
                    <article class="detail-card" data-reveal>
                        <header class="detail-card__head">
                            <i class="fas fa-clipboard-list" aria-hidden="true"></i>
                            <h2 data-i18n="detail.infoTitle">Ficha del proyecto</h2>
                        </header>
                        <ul class="data-list" data-project-sheet></ul>
                    </article>

                    <article class="detail-card" data-reveal>
                        <header class="detail-card__head">
                            <i class="fas fa-user" aria-hidden="true"></i>
                            <h2 data-site="person.displayName">Andrey Mantilla</h2>
                        </header>
                        <p class="card__text" data-site="person.headline"></p>
                        <div class="social-row" style="margin-top: var(--space-4);" data-socials></div>
                    </article>
                </aside>
            </div>

            <!-- NAVEGACION -->
            <nav class="project-switch" data-project-switch aria-label="Navegación entre proyectos"></nav>
        </div>
    </section>

    <!-- FOOTER -->
    <footer class="footer">
        <div class="container">
            <div class="footer__bottom" style="border-top: 0;">
                <p>&copy; 2026 <span data-site="person.fullName"></span>. <span data-i18n="footer.rights">Todos los derechos reservados.</span></p>
                <a class="btn btn--outline btn--sm" href="../index.html#proyectos">
                    <i class="fas fa-arrow-left" aria-hidden="true"></i>
                    <span data-i18n="detail.back">Volver al portafolio</span>
                </a>
            </div>
        </div>
    </footer>

    <button class="to-top" type="button" data-to-top data-i18n="nav.top" data-i18n-attr="aria-label" aria-label="Volver arriba">
        <i class="fas fa-arrow-up" aria-hidden="true"></i>
    </button>

    <!-- LIGHTBOX -->
    <div class="lightbox" data-lightbox role="dialog" aria-modal="true">
        <button class="lightbox__close" type="button" data-lightbox-close data-i18n="detail.close" data-i18n-attr="aria-label" aria-label="Cerrar">
            <i class="fas fa-xmark" aria-hidden="true"></i>
        </button>
        <!-- IMG -->
        <img data-lightbox-image src="" alt="">
    </div>

    <script type="module" src="../assets/js/pages/project.js"></script>
</body>
</html>
